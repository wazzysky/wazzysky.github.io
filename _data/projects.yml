- slug: point-cloud-benchmark
  url: "/projects/point-cloud-benchmark/"
  type: 科研项目
  title: 科研项目 —— 一、三维点云语义切割算法复现
  tagline: 为无人机零样本自主导航在室内复杂环境下构建感知，实现 3D 点云语义切割复现调研。
  brief: 负责两种算法的全流程复现、跨场景性能测试及推理时延分析，同时完成 3D 点云的下采样，调整参数将相隔很近的物理实体分开。
  cover: "/img/cenetbg.png"
  role: 负责两种算法的全流程复现、跨场景性能测试及推理时延分析，同时完成 3D 点云的下采样与实体分离。
  goal: 为无人机零样本自主导航在室内复杂环境下构建感知，实现 3D 点云语义切割复现调研。
  stack:
  - Python
  - PyTorch
  - CENet
  - Pointcept
  - DBSCAN
  - KdTree
  metrics:
  - label: CENet 本地指标
    value: Acc 82.0% / mIoU 49.7%
  - label: Pointcept 本地指标
    value: allAcc 71.9% / mIoU 39.2%
  - label: 推理速度
    value: 15 FPS / 2 FPS
  sections:
  - title: 任务目标与完成内容
    paragraphs:
    - 本次科研项目主要在大二暑假实习期间完成，围绕论文复现、环境配置、数据集训练测试与结果可视化展开。
    bullets:
    - 复现 CENet：通过球面投影将无序点云转化为有序 2D 全景图，利用大核卷积实现推理效率与结构特征提取。
    - 复现 Pointcept：采用序列化注意力机制，通过规避昂贵的近邻搜索，平衡 Transformer 对复杂三维几何的建模精度与计算开销。
    - 利用 DBSCAN 算法实现 3D 点云下采样，建立 KdTree 并调整密度可达距离参数，将 Unity 建模中采样的相近物理实体点云分开。
  - title: 性能对比
