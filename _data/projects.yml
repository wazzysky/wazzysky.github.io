  - slug: ssl-local-vision
    url: /projects/ssl-local-vision/
    type: 比赛项目
    title: RoboCup SSL 局部视觉性能重构
    tagline: 从 Python 迁移到 C++ 双线程链路，压缩树莓派端非确定性延迟。
    brief: 面向高动态足球机器人，重构局部视觉采集与检测流程，重点解决双目同步和实时性问题。
    cover: /img/mul.png
    role: 独立负责从 Python 到 C++ 的全链路重构，以及底层 libcamera 驱动接入。
    goal: 让树莓派局部视觉在不同分辨率下稳定运行于高帧率状态，并为下游控制提供低时延坐标。
    stack:
      - C++
      - OpenCV
      - libcamera
      - Multi-threading
      - Raspberry Pi
    metrics:
      - label: 1536×864
        value: 120 FPS
      - label: 2304×1296
        value: 56 FPS
      - label: 4608×2592
        value: 16 FPS
    resources:
      - label: GitHub 仓库
        url: https://github.com/wazzysky/localvision
    sections:
      - title: 架构改造
        bullets:
          - 利用 C++ 构建图像接收与图像处理双线程模型，规避 Python GIL 带来的并行瓶颈。
          - 直接操作 libcamera 原始 Buffer，以主从同步模式完成双目图像采集。
          - 通过降采样、HSV 双阈值滤波、形态学去噪与最小外接圆拟合完成亮橙色足球定位。
          - 对左右相机坐标做融合，并通过标定得到世界坐标结果。
      - title: 性能观察
        paragraphs:
          - 通过打印 Wait、Cvt、Det 等链路时间，可以看到 60 FPS 运行时等待时间仍较长，说明链路仍有进一步提升空间。
