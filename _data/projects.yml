- slug: distributed-control-architecture
  url: "/projects/distributed-control-architecture/"
  type: 比赛项目
  title: 比赛项目 —— 二、Robocup SSL 系统架构重构
  tagline: Robocup 原架构为树莓派加 STM32，树莓派性能冗余，因此计划将机器人控制核心从树莓派迁移至 MCU——ESP32。
  brief: 独立负责 ESP32C5 上的联网、UDP 通信链路实现、实时任务调度以及与 STM32 的 SPI 通信。
  cover: "/img/espm.png"
  role: 独立负责 ESP32C5 上的联网、UDP 通信链路实现、实时任务调度以及与 STM32 的 SPI 通信。
  goal: 将机器人控制核心从树莓派迁移到 ESP32，建立更轻量的实时控制架构。
  stack:
  - ESP32C5
  - FreeRTOS
  - UDP
  - Protobuf
  - SPI
  metrics:
  - label: 控制任务
    value: 100 Hz
  - label: 状态回传
    value: 50 Hz
  - label: 底层架构
    value: 三独立任务
  resources:
  - label: GitHub 仓库
    url: https://github.com/wazzysky/sample_project
  sections:
  - title: 完成内容
    paragraphs:
    - 在 ESP32 的底层 FreeRTOS 架构上建立三个独立任务。
    bullets:
    - 100HZ 核心控制底盘任务。
    - UDP 高频接收 Protobuf 信息任务。
    - 50HZ UDP 状态回传任务。
  - title: 难点与成果展示
    bullets:
    - 由于轮子非对称，前后轮夹角不一样，每次计算解算公式会消耗大量 CPU 时间。
    - 采用编译期常量避免运行时三角函数计算与矩阵求逆，降低解算开销。
    - 测试时串口打印信息过多，导致向上位机发送信息的低优先级任务无法获得 CPU 时间；改为每 100 次接收信息打印一次后恢复稳定。
    media:
