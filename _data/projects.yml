projects:
  - slug: point-cloud-benchmark
    url: /projects/point-cloud-benchmark/
    type: 科研项目
    title: 三维点云语义分割算法复现与性能标定
    tagline: 复现 CENet 与 Pointcept，并对精度、时延与硬件瓶颈进行量化对比。
    brief: 聚焦无人机零样本自主导航中的感知前端，完成 3D 点云语义分割算法的复现与性能边界分析。
    cover: /img/cenetbg.png
    role: 负责两种算法的全流程复现、跨场景性能测试及推理时延分析。
    goal: 为室内复杂环境感知建立一套可复现实验链路，并明确不同方法的工程可用边界。
    stack:
      - Python
      - PyTorch
      - CENet
      - Pointcept
      - SemanticKITTI
      - S3DIS
    metrics:
      - label: CENet 本地 mIoU
        value: 49.7%
      - label: Pointcept 本地 mIoU
        value: 39.2%
      - label: CENet 推理时延
        value: "~68 ms"
    sections:
      - title: 复现范围
        paragraphs:
          - 面向无人机零样本自主导航的室内复杂环境感知，重点复现并评估两类代表性语义分割方案。
        bullets:
          - CENet 通过球面投影将无序点云转成 2D 全景图，利用大核卷积兼顾结构表达与推理效率。
          - Pointcept PTv3 使用序列化注意力机制，规避昂贵近邻搜索，提升复杂三维几何建模能力。
      - title: 性能对比与误差来源
        bullets:
          - 本地显卡为 RTX 4060，与论文中的高算力训练环境存在显著差距，导致单帧推理时间增加。
          - 显存限制使 Batch Size 从 24 压缩到 1，训练过程中的梯度噪声更大。
          - 训练轮数和训练区域均受限，模型未进入充分收敛阶段，造成 mIoU 和 allAcc 下滑。
        table:
          headers:
            - 模型
            - 测试数据集
            - 官方指标
            - 本地实测
            - 推理时延
          rows:
            - - CENet
              - SemanticKITTI
              - "mIoU 64.7% / 37.8 FPS"
              - "Acc 82.0% / mIoU 49.7%"
              - "~68 ms / 15 FPS"
            - - Pointcept PTv3
              - S3DIS Area_5
              - "mIoU 70%+ / 22 FPS"
              - "allAcc 71.9% / mIoU 39.2%"
              - "~500 ms / 2 FPS"
        media:
          - type: image
            src: /img/cenetbg.png
            alt: CENet 结果可视化
            caption: CENet 的语义分割可视化结果。
          - type: image
            src: /img/cenettest.png
            alt: CENet 测试过程
            caption: CENet 的本地测试流程截图。
          - type: image
            src: /img/ptrain.png
            alt: Pointcept 训练过程
            caption: Pointcept 的训练与日志结果。
          - type: image
            src: /img/peva.png
            alt: Pointcept 评估结果
            caption: Pointcept 的验证与评估截图。

  - slug: point-cloud-instance-lock
    url: /projects/point-cloud-instance-lock/
    type: 科研项目
    title: 感知系统的鲁棒性优化：从语义分割到实例锁定
    tagline: 基于 DBSCAN 思路对点云簇进行边界分离，减少误检带来的虚假避障。
    brief: 处理 Unity 仿真环境中 RGB-D 与雷达融合点云的重叠问题，增强语义感知结果的稳定性。
    cover: /img/dbscan.jpg
    role: 负责 3D 点云下采样与实例边界分离算法实现。
    goal: 从语义标签结果进一步锁定物理实体主体，提升下游导航规划的稳定性。
    stack:
      - PCL
      - DBSCAN
      - EuclideanClusterExtraction
      - KdTree
    metrics:
      - label: 方法核心
        value: DBSCAN 风格聚类
      - label: 目标
        value: 抑制虚假障碍
      - label: 场景
        value: Unity 仿真点云
    sections:
      - title: 问题定义
        paragraphs:
          - 无人机在 Unity 场景中获取的点云簇存在重叠交集，椅子与凳子等近邻目标在特定视角下容易混合，影响导航器判断。
        bullets:
          - 采样点云边缘存在离散杂点，深度图对齐误差会进一步放大误报。
          - 单纯依赖语义标签无法稳定锁定真实物理实体主体。
      - title: 解决思路
        bullets:
          - 参考 PCL 中欧式聚类提取的思路，实现 DBSCAN 风格的聚类分离。
          - 通过 `_dbscan_eps` 与 `_dbscan_min_pts` 控制聚类半径和最小成类点数，将空间不连续的误报剔除。
          - 在每个语义标签下遍历聚类结果，选择点数最多的簇作为实体主体。
          - 结果直接服务于下游规划器，减少频繁触发的虚假避障。
        media:
          - type: image
            src: /img/dbscan.jpg
            alt: DBSCAN 流程图
            caption: 基于点云簇边界分离的实例锁定流程。

