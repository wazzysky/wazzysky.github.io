  - slug: distributed-control-architecture
    url: /projects/distributed-control-architecture/
    type: 比赛项目
    title: 分布式异构系统架构与通信协议设计
    tagline: 将控制核心迁移到 ESP32C5，在 WiFi-UDP 与 SPI DMA 之间维持硬实时闭环。
    brief: 围绕 RoboCup 系统升级，重新设计主控分层、通信协议与实时任务调度策略。
    cover: /img/espm.png
    role: 负责跨平台通信协议设计、UDP 链路实现与 ESP32 端实时任务调度。
    goal: 用更轻量的实时 MCU 接管控制核心，降低非实时 Linux 平台带来的控制抖动。
    stack:
      - ESP32C5
      - FreeRTOS
      - UDP
      - Nanopb
      - SPI DMA
    metrics:
      - label: 核心控制频率
        value: 100 Hz
      - label: 状态回传
        value: 50 Hz
      - label: SPI 链路
        value: 10 MHz DMA
    resources:
      - label: GitHub 仓库
        url: https://github.com/wazzysky/sample_project
    sections:
      - title: 系统设计
        paragraphs:
          - 项目将机器人控制核心从树莓派迁移到 ESP32C5，并保留树莓派、STM32 作为分层协作节点。
        bullets:
          - 在 FreeRTOS 上拆分 UDP 接收、状态回传、底盘控制三个任务，确保网络抖动不会打断控制闭环。
          - 使用 `vTaskDelayUntil` 保持 100 Hz 绝对时序，降低里程计积分误差。
          - 通过 Nanopb 编解码二进制指令，减少文本协议带来的带宽与 CPU 开销。
      - title: 算力与稳定性优化
        bullets:
          - 对四轮非对称底盘的运动学系数做预计算，将循环内运算简化为乘加运算。
          - 串口调试信息过多会导致低优先级任务饥饿，降低打印频率后通信恢复稳定。
        media:
          - type: image
            src: /img/espm.png
            alt: 系统架构图
            caption: 分布式异构控制系统的总体拓扑结构。
          - type: image
            src: /img/esp.jpg
            alt: ESP32 实测
            caption: ESP32 端运行与联调截图。

  - slug: smart-trash-bin
    url: /projects/smart-trash-bin/
    type: 课程项目
    title: “喂不饱的 AI 捕手”：树莓派智能垃圾桶系统实践
    tagline: 结合 120 FPS 局部视觉与 YOLOv11 识别，完成从电路焊接到感知追踪的一体化实现。
    brief: 基于树莓派 5 与 STM32F401 构建移动拦截机器人，集成目标识别、追踪与底盘控制。
    cover: /img/正面.jpg
    role: 独立负责硬件选型、搭建焊接、视觉算法集成与整机联调。
    goal: 实现一个可移动、可识别、可追踪的智能垃圾桶系统，并完成完整 Demo 交付。
    stack:
      - Raspberry Pi 5
      - STM32F401
      - YOLOv11
      - ONNX
      - OpenCV
      - PID
    metrics:
      - label: 数据集规模
        value: 367 张图像
      - label: 上位机视觉
        value: 120 FPS
      - label: 下位机 PWM
        value: 20 kHz
    resources:
      - label: GitHub 仓库
        url: https://github.com/wazzysky/motion_control
    sections:
      - title: 分布式架构
        bullets:
          - 树莓派 5 负责高频视觉流采集、状态机逻辑与麦轮运动学求解。
          - STM32F401 通过 USB CDC 与上位机通信，并负责 4 路 PWM 输出与底层安全逻辑。
          - 在洞洞板上完成手工走锡和高电流走线，保障整机电气可靠性。
      - title: 感知链路
        bullets:
          - 复用了 RoboCup 局部视觉线程的核心逻辑，保证传统视觉链路的实时性。
          - 自主采集视频帧并使用 Roboflow 进行标注、预处理和数据集划分。
          - 训练后导出轻量化 ONNX 模型，部署到树莓派实现 YOLO 识别。
