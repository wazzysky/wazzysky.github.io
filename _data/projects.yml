- slug: srtp-face-anti-spoofing
  url: "/projects/srtp-face-anti-spoofing/"
  type: 科研项目
  title: 科研项目 —— 三、基于非对称对比学习的人脸反欺骗跨域泛化研究
  tagline: 围绕跨域人脸反欺骗任务，复现并工程化实现基于 Vision Transformer 的非对称对比学习框架，完成跨域泛化实验验证。
  brief: 在本科 SRTP 项目中，围绕未知攻击场景下的人脸反欺骗跨域泛化问题，完成论文复现、数据清洗、训练测试流水线搭建与实验优化。
  cover: "/img/srtp-tsne-cover.png"
  role: 独立负责论文方法复现、四数据集预处理、训练测试框架搭建、实验调参与结果可视化分析。
  goal: 面向未知攻击场景下的人脸反欺骗跨域泛化问题，完成基于非对称对比学习的方法复现与工程化验证。
  stack:
  - PyTorch
  - Vision Transformer
  - ArcFace
  - MTCNN
  - Contrastive Learning
  - ROC
  - t-SNE
  metrics:
  - label: 核心协议
    value: ICM_to_O
  - label: AUC
    value: 97.13%
  - label: HTER
    value: 8.40%
  sections:
  - title: 任务目标与核心方法
    paragraphs:
    - 项目聚焦 Face Anti-Spoofing 跨域泛化问题，目标不是做人脸身份识别，而是判断输入人脸是真人还是照片、视频、屏幕回放等攻击样本。
    bullets:
    - 复现 Token-Wise Asymmetric Contrastive Learning 论文，构建以 Vision Transformer 为骨干、结合
      ArcFace 分类约束和非对称对比损失的跨域人脸反欺骗模型。
    - 在特征空间中显式建模“真实人脸应聚合、攻击样本只需远离真实人脸而无需彼此聚合”的非对称结构，以提升面对未知攻击类型时的鲁棒性。
    - 基于 ViT 提取 token 级局部特征，引入双视图增强与对比学习机制，完成从论文理解到工程实现的完整闭环。
  - title: 完成内容
    bullets:
    - 统一整理 OULU-NPU、CASIA-MFSD、ReplayAttack 和 MSU-MFSD 四个公开数据集，完成目录清洗、异常样本过滤、MTCNN
      人脸裁剪和 live/spoof 标签整理。
    - 搭建训练、测试与可视化脚本，支持 checkpoint 管理、训练曲线、ROC、混淆矩阵、协议级与逐轮 t-SNE 可视化，以及论文表格自动生成。
    - 编写 safe_sort、generate_report_assets、generate_epoch_tsne_series、generate_paper_assets
      等工具脚本，提升实验可追踪性与材料产出效率。
  - title: 难点与结果
    bullets:
    - 在多轮实验中定位并修正预训练缺失、数据集标签规则偏差、类别比例失衡和增强策略不合理等问题。
    - 通过接入预训练权重、类别比例控制和增强策略优化，在 ICM_to_O 协议下将结果提升至 AUC 97.13%、HTER 8.40%。
    - 最终形成可直接支撑论文撰写、结项答辩和个人网站展示的完整实验材料。
