    - 由于 GPU 显存限制，Batch Size 从 24 降到 1，同时 RTX 4060 算力有限，导致单帧推理时间增加。
    - 由于固态硬盘大小限制，只能对数据集中的部分区域进行训练，且训练时间不足，导致 mIoU 与 Acc 下降。
    - CENet 官方代码没有提供室内数据集如 S3DIS 的处理接口，因此跨场景验证存在明显限制。
